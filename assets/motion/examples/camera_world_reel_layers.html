<!doctype html>
<html><head><meta charset="utf-8">

</head><body>
<svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">

    <pattern id="dots" width="54" height="54" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.6" fill="#D9D3C6"/></pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#141413" flood-opacity=".10"/></filter>
  </defs>

  <g id="para"><rect x="-3000" y="-3000" width="12000" height="12000" fill="url(#dots)"/></g>
  <g id="camwrap" filter="url(#mblur)"><g id="cam"></g></g>
  <g id="hud"></g>
  <circle id="wipe" data-layer="S7_orange" cx="540" cy="640" r="0" fill="#D97757"/>
  <g id="s7"></g>
  <g id="topLayer"></g>
</svg>
<script>
const { E, clamp, lerp, mapr, prog, win, pop, fade, draw, tr, $ } = KADR_HELPERS;
const INK = '#141413', OR = '#D97757', ORD = '#C15F3C', PAPER = '#FAF9F5', BG = '#F0EEE6', GRAY = '#B0AEA5', LINE = '#DED8CB';
const NS = 'http://www.w3.org/2000/svg';
const S = [0, 3.45, 8.16, 12.2, 17.3, 22.38, 28.9, 31.77];          // scene borders (seconds)
const O = [[0, 0], [1500, -260], [3000, 0], [3000, 1900], [1500, 2150], [0, 1900]];  // scene origins on the world canvas
const amp = t => AMP[clamp(Math.round(t * 30), 0, AMP.length - 1)] || 0;

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || $('cam')).appendChild(e);
  return e;
}
const line = (d, p, extra = {}) => el('path', Object.assign({ d, pathLength: 1, fill: 'none', stroke: INK, 'stroke-width': 7,
  'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, extra), p);
const text = (s, x, y, cls, size, fill, p, anchor = 'middle') => { const e = el('text', { x, y, class: cls, 'font-size': size, fill,
  'text-anchor': anchor, 'dominant-baseline': 'middle' }, p); e.textContent = s; return e; };
const scene = i => el('g', { transform: `translate(${O[i][0]} ${O[i][1]})` });
// ---- editable layers: every group below becomes its own transparent clip in Filmora
const LAYERS = [{ name: 'bg', start: 0, end: 31.77, opaque: true }];
const WIN = i => [Math.max(0, S[i] - 0.3), Math.min(S[7], S[i + 1] + 0.25)];
const lay = (name, parent, i) => { const g = el('g', { 'data-layer': name }, parent); const [a, b] = WIN(i); LAYERS.push({ name, start: a, end: b }); return g; };

// ---------------------------------------------------------------- S1 hook: speech bubble + live voice waveform
const g1 = scene(0);
const L1a = lay('S1_bubble', g1, 0), L1b = lay('S1_voice_bars', g1, 0), L1c = lay('S1_sparks', g1, 0);
const bubble1 = line('M 290 420 H 790 Q 840 420 840 470 V 730 Q 840 780 790 780 H 450 L 350 865 L 372 780 H 290 Q 240 780 240 730 V 470 Q 240 420 290 420 Z', L1a, { fill: PAPER, 'fill-opacity': 0 });
const bars1 = [...Array(15)].map((_, i) => el('rect', { x: 316 + i * 31, y: 600, width: 16, height: 10, rx: 8, fill: OR }, L1b));
const spark1 = ['M 880 380 L 905 340', 'M 905 420 L 950 405', 'M 860 352 L 858 305'].map(d => line(d, L1c, { stroke: OR, 'stroke-width': 8 }));

// ---------------------------------------------------------------- S2 skyline -> falcon
const g2 = scene(1);
const sky = lay('S2_skyline', g2, 1);
const sun = el('circle', { cx: 700, cy: 560, r: 95, fill: OR }, sky);
const ground = line('M 110 900 H 970', sky);
const towers = [
  'M 160 900 V 640 H 250 V 900', 'M 275 900 V 560 L 310 490 L 345 560 V 900', 'M 372 900 V 620 Q 427 560 482 620 V 900',
  'M 510 900 V 470 L 550 420 L 590 470 V 900 M 550 420 V 360', 'M 620 900 L 640 590 L 720 570 L 715 900',
  'M 748 900 V 680 H 840 V 900', 'M 862 900 V 610 Q 897 585 932 610 V 900'].map(d => line(d, sky, { fill: BG, 'fill-opacity': 1 }));
const wins = ['M 185 690 H 225 M 185 740 H 225 M 185 790 H 225', 'M 535 520 H 565 M 535 580 H 565 M 535 640 H 565 M 535 700 H 565',
  'M 773 720 H 815 M 773 770 H 815'].map(d => line(d, sky, { 'stroke-width': 5 }));
const falcon = lay('S2_falcon', g2, 1);
const ring2 = el('circle', { cx: 560, cy: 610, r: 330, pathLength: 1, fill: 'none', stroke: OR, 'stroke-width': 7, 'stroke-linecap': 'round' }, falcon);
const fparts = ['M 300 840 C 280 680 330 500 470 440 C 560 402 680 420 740 500 L 820 530 C 842 541 842 575 815 590 C 790 605 760 602 742 590 C 730 670 680 730 610 760 C 560 782 520 820 510 860',
  'M 590 480 C 620 460 670 465 700 490', 'M 640 535 C 630 590 600 640 560 680', 'M 742 590 C 760 565 790 550 820 540'].map(d => line(d, falcon, { 'stroke-width': 9 }));
const eye2 = el('circle', { cx: 640, cy: 510, r: 20, fill: OR }, falcon);

// ---------------------------------------------------------------- S3 speech -> chip -> text
const g3 = scene(2);
const L3a = lay('S3_voice_bars', g3, 2), L3b = lay('S3_flow', g3, 2), L3c = lay('S3_chip', g3, 2), L3d = lay('S3_text_lines', g3, 2);
const bars3 = [...Array(8)].map((_, i) => el('rect', { x: 110 + i * 28, y: 620, width: 14, height: 10, rx: 7, fill: OR }, L3a));
const conL = el('path', { d: 'M 345 620 H 425', fill: 'none', stroke: INK, 'stroke-width': 6, 'stroke-dasharray': '10 12', 'stroke-linecap': 'round' }, L3b);
const conR = el('path', { d: 'M 655 620 H 745', fill: 'none', stroke: INK, 'stroke-width': 6, 'stroke-dasharray': '10 12', 'stroke-linecap': 'round' }, L3b);
const orbit = el('circle', { cx: 540, cy: 620, r: 165, fill: 'none', stroke: GRAY, 'stroke-width': 4, 'stroke-dasharray': '6 16' }, L3c);
const chip = line('M 460 510 H 620 Q 650 510 650 540 V 700 Q 650 730 620 730 H 460 Q 430 730 430 700 V 540 Q 430 510 460 510 Z', L3c, { fill: PAPER, 'fill-opacity': 0 });
const pins = line('M 480 510 V 480 M 520 510 V 480 M 560 510 V 480 M 600 510 V 480 M 480 730 V 760 M 520 730 V 760 M 560 730 V 760 M 600 730 V 760 M 430 560 H 400 M 430 620 H 400 M 430 680 H 400 M 650 560 H 680 M 650 620 H 680 M 650 680 H 680', L3c, { 'stroke-width': 6 });
const asr = text('ASR', 540, 624, 'en8', 54, INK, L3c);
const tl3 = [200, 160, 190, 120, 170].map((w, i) => line(`M 965 ${525 + i * 48} H ${965 - w}`, L3d, { stroke: i === 1 ? OR : INK, 'stroke-width': 14 }));
const dots3 = [...Array(3)].map(() => el('circle', { cx: 0, cy: 620, r: 7, fill: OR }, L3b));

// ---------------------------------------------------------------- S4 dialects: four bubbles, Emirati lights up
const g4 = scene(3);
const B4 = [[760, 470, 'كيف حالك؟', 'فصحى', 12.5], [320, 470, 'إزيّك؟', 'مصري', 13.82], [760, 790, 'كيفك؟', 'شامي', 14.05], [320, 790, 'شحالك؟', 'إماراتي', 14.3]];
const bub4 = B4.map(([cx, cy, phrase, label], i) => {
  const g = lay('S4_bubble_' + (i + 1), g4, 3);
  const d = `M ${cx - 170} ${cy - 105} H ${cx + 170} Q ${cx + 200} ${cy - 105} ${cx + 200} ${cy - 75} V ${cy + 75} Q ${cx + 200} ${cy + 105} ${cx + 170} ${cy + 105} H ${cx + (i % 2 ? 40 : -40)} L ${cx + (i % 2 ? -10 : 10)} ${cy + 160} L ${cx + (i % 2 ? 0 : 0)} ${cy + 105} H ${cx - 170} Q ${cx - 200} ${cy + 105} ${cx - 200} ${cy + 75} V ${cy - 75} Q ${cx - 200} ${cy - 105} ${cx - 170} ${cy - 105} Z`;
  const fill = el('path', { d, fill: OR, opacity: 0 }, g);
  const out = el('path', { d, fill: PAPER, stroke: INK, 'stroke-width': 7, 'stroke-linejoin': 'round' }, g);
  const ph = text(phrase, cx, cy - 12, 'ar', 58, INK, g);
  const lb = text(label, cx, cy + 58, 'ar2', 34, GRAY, g);
  return { g, fill, out, ph, lb };
});
const L4c = lay('S4_check', g4, 3);
const ripple4 = el('path', { d: '', fill: 'none', stroke: OR, 'stroke-width': 6 }, L4c);
const check4 = el('g', {}, L4c);
el('circle', { cx: 500, cy: 690, r: 38, fill: INK }, check4);
const checkm = line('M 482 690 L 496 704 L 520 678', check4, { stroke: BG, 'stroke-width': 8 });

// ---------------------------------------------------------------- S5 six benchmarks: previous best vs Falcon (fewer errors)
const g5 = scene(4);
const L5a = lay('S5_axes', g5, 4), L5b = lay('S5_bars_previous', g5, 4), L5c = lay('S5_bars_falcon', g5, 4), L5d = lay('S5_legend', g5, 4);
const grid5 = [480, 620, 760].map(y => line(`M 150 ${y} H 950`, L5a, { stroke: LINE, 'stroke-width': 3 }));
const axis5 = line('M 150 380 V 900 H 950', L5a);
const H1 = [330, 360, 300, 380, 320, 350], H2 = [240, 270, 205, 280, 230, 255];
const bar5 = H1.map((h, i) => {
  const x = 235 + i * 130;
  const prev = el('rect', { x: x - 52, y: 900 - h, width: 46, height: h, rx: 6, fill: PAPER, stroke: INK, 'stroke-width': 5 }, L5b);
  const fal = el('rect', { x: x + 6, y: 900 - H2[i], width: 46, height: H2[i], rx: 6, fill: OR }, L5c);
  const n = text(String(i + 1), x, 945, 'en', 28, GRAY, L5a);
  return { prev, fal, n };
});
const leg5 = el('g', {}, L5d);
el('rect', { x: 905, y: 318, width: 30, height: 30, rx: 5, fill: PAPER, stroke: INK, 'stroke-width': 4 }, leg5);
text('أفضل نتيجة سابقة', 890, 335, 'ar2', 34, INK, leg5, 'start');
const leg5b = el('g', {}, L5d);
el('rect', { x: 545, y: 318, width: 30, height: 30, rx: 5, fill: OR }, leg5b);
text('Falcon ASR', 530, 335, 'en8', 32, INK, leg5b, 'end');
const down5 = line('M 1000 520 V 640 M 975 612 L 1000 642 L 1025 612', L5d, { stroke: OR, 'stroke-width': 8 });

// ---------------------------------------------------------------- S6 word timing: timeline + playhead + word chips
const g6 = scene(5);
const L6a = lay('S6_timeline', g6, 5), L6b = lay('S6_word_chips', g6, 5);
const tline = line('M 980 760 H 100', L6a, { 'stroke-width': 6 });
const ticks6 = [...Array(15)].map((_, i) => line(`M ${960 - i * 60} 760 V 778`, L6a, { 'stroke-width': 4, stroke: GRAY }));
const wave6 = [...Array(70)].map((_, i) => el('rect', { x: 966 - i * 12.4, y: 830, width: 6, height: 4, rx: 3, fill: GRAY }, L6a));
const W1 = [22.38, 25.14], W2 = [25.14, 28.9];
const xOf = (t, w) => mapr(t, w[0], w[1], 960, 120);
const chips6 = WORDS.map((w, i) => i).filter(i => WORDS[i][1] >= 22.3 && WORDS[i][1] < 28.9).map((i, k) => {
  const [word, s, e] = WORDS[i];
  const w = s < 25.14 ? W1 : W2;
  const cx = xOf((s + e) / 2, w), cy = k % 2 ? 560 : 650, wd = 70 + word.length * 26;
  const g = el('g', {}, L6b);
  const r = el('rect', { x: cx - wd / 2, y: cy - 38, width: wd, height: 76, rx: 38, fill: PAPER, stroke: INK, 'stroke-width': 5 }, g);
  const tx = text(word, cx, cy + 2, 'ar', 34, INK, g);
  const stem = el('line', { x1: cx, y1: cy + 38, x2: cx, y2: 752, stroke: GRAY, 'stroke-width': 3, 'stroke-dasharray': '4 6' }, L6b);
  return { g, r, tx, stem, s, e, w };
});
const head6 = el('g', {}, L6a);
el('line', { x1: 0, y1: 600, x2: 0, y2: 880, stroke: OR, 'stroke-width': 6, 'stroke-linecap': 'round' }, head6);
el('circle', { cx: 0, cy: 760, r: 14, fill: OR }, head6);

// ---------------------------------------------------------------- S7 call to action (screen space, on orange)
const g7 = $('s7');
const W7 = i => ({ start: 28.8, end: 31.77 });
LAYERS.push({ name: 'S7_orange', start: 28.8, end: 31.77 });
const lay7 = name => { const g = el('g', { 'data-layer': name }, g7); LAYERS.push(Object.assign({ name }, W7())); return g; };
const L7a = lay7('S7_ring'), L7c = lay7('S7_cursor');
const ring7 = line('M 540 390 A 230 230 0 1 1 539.9 390', L7a, { stroke: BG, 'stroke-width': 6 });
const btn7 = lay7('S7_button');
el('rect', { x: 290, y: 545, width: 500, height: 120, rx: 60, fill: BG }, btn7);
const btnTxt = text('Hugging Face', 540, 607, 'en8', 46, INK, btn7);
const arrowTxt = text('→', 540, 603, 'en8', 64, INK, btn7);
const rays7 = [...Array(10)].map((_, i) => { const a = i / 10 * Math.PI * 2;
  return line(`M ${540 + Math.cos(a) * 290} ${605 + Math.sin(a) * 180} L ${540 + Math.cos(a) * 350} ${605 + Math.sin(a) * 225}`, L7a, { stroke: INK, 'stroke-width': 7 }); });
const cursor7 = el('path', { d: 'M 0 0 L 0 92 L 24 70 L 42 110 L 60 102 L 42 63 L 74 62 Z', fill: BG, stroke: INK, 'stroke-width': 6, 'stroke-linejoin': 'round' }, L7c);
const click7 = el('circle', { cx: 0, cy: 0, r: 0, fill: 'none', stroke: INK, 'stroke-width': 5 }, L7c);

// ---------------------------------------------------------------- HUD: progress bar, labels, scene counter
const topG = $('topLayer');
el('line', { x1: 80, y1: 130, x2: 1000, y2: 130, stroke: LINE, 'stroke-width': 6, 'stroke-linecap': 'round' }, topG);
const prog7 = el('line', { x1: 1000, y1: 130, x2: 1000, y2: 130, stroke: OR, 'stroke-width': 6, 'stroke-linecap': 'round' }, topG);
const lab = text('AI NEWS · 2026', 80, 92, 'en', 26, INK, topG, 'start');
const cnt = text('01 / 07', 1000, 92, 'en', 26, INK, topG, 'end');

// ---------------------------------------------------------------- camera
function camera(t) {
  // returns {x, y, z, r, bx, by}: world point under the graphic centre, zoom, roll, motion-blur vector
  let i = 0; while (i < 5 && t >= S[i + 1] + 0.25) i++;
  const center = k => [O[k][0] + 540, O[k][1] + 640];
  if (i < 5 && t >= S[i + 1] - 0.3) {                       // travelling from scene i to i+1
    const a = S[i + 1] - 0.3, b = S[i + 1] + 0.25, u = prog(t, a, b, 'inout'), m = Math.sin(Math.PI * u);      // eased: zoom dip, roll and blur start softly
    const [x0, y0] = center(i), [x1, y1] = center(i + 1), dx = x1 - x0, dy = y1 - y0, dist = Math.hypot(dx, dy);
    return { x: lerp(x0, x1, u) + 12 * Math.sin(t * 0.7), y: lerp(y0, y1, u) + 8 * Math.cos(t * 0.5), z: 1.05 - 0.3 * m, r: (i % 2 ? -1 : 1) * 4 * m + 0.6 * Math.sin(t * 0.4), bx: 26 * m * Math.abs(dx) / dist, by: 26 * m * Math.abs(dy) / dist };
  }
  const [x, y] = center(i), a = S[i] + (i ? 0.25 : 0), b = S[i + 1] - 0.3;
  const intro = i === 0 ? 0.3 * (1 - prog(t, 0, 0.9, 'out')) : 0;   // opening pull-back
  return { x: x + 12 * Math.sin(t * 0.7), y: y + 8 * Math.cos(t * 0.5), z: 1 + 0.05 * prog(t, a, b, 'inout') + intro, r: 0.6 * Math.sin(t * 0.4), bx: 0, by: 0 };
}

// ---------------------------------------------------------------- render(t)
function render(t) {
  const c = camera(t);
  $('cam').setAttribute('transform', `translate(540 640) rotate(${c.r}) scale(${c.z}) translate(${-c.x} ${-c.y})`);
  $('para').setAttribute('transform', `translate(540 640) scale(${0.6 + 0.4 * c.z}) translate(${-c.x * 0.45} ${-c.y * 0.45})`);
  $('mblurk').setAttribute('stdDeviation', `${Math.max(0.01, c.bx).toFixed(2)} ${Math.max(0.01, c.by).toFixed(2)}`);   // never 0: switching the filter on/off pops a frame

  // S1
  draw(bubble1, prog(t, 0.1, 0.9));
  bubble1.setAttribute('fill-opacity', prog(t, 0.6, 1.0));
  bars1.forEach((b, i) => {
    const prof = Math.exp(-Math.pow((i - 7) / 4.2, 2));
    const h = (16 + 230 * amp(t - Math.abs(i - 7) * 0.035) * prof) * pop(t, 0.45 + i * 0.03, 0.4);
    b.setAttribute('height', Math.max(0, h)); b.setAttribute('y', 600 - h / 2);
  });
  spark1.forEach((s, i) => draw(s, prog(t, 1.94 + i * 0.06, 2.25 + i * 0.06, 'out') - prog(t, 3.0, 3.3)));

  // S2
  draw(ground, prog(t, 3.55, 4.05));
  towers.forEach((w, i) => draw(w, prog(t, 3.75 + i * 0.17, 4.35 + i * 0.17)));
  wins.forEach((w, i) => draw(w, prog(t, 5.0 + i * 0.12, 5.4 + i * 0.12)));
  tr(sun, { s: pop(t, 5.3, 0.6), y: 60 * (1 - prog(t, 5.3, 6.0, 'out')) });
  tr(sky, { y: 60 * prog(t, 6.2, 6.7), o: 1 - 0.85 * prog(t, 6.2, 6.7) });
  fparts.forEach((p, i) => draw(p, prog(t, 6.5 + i * 0.1, 7.15 + i * 0.1)));
  tr(eye2, { s: pop(t, 7.1, 0.35) });
  draw(ring2, prog(t, 7.1, 7.75, 'out'));
  tr(falcon, { s: 0.92 + 0.08 * prog(t, 6.7, 7.4, 'out') + 0.05 * pop(t, 6.86, 0.25) * (1 - prog(t, 7.1, 7.4)) });

  // S3
  bars3.forEach((b, i) => {
    const h = (12 + 170 * amp(t - (7 - i) * 0.03) * (0.5 + 0.5 * Math.sin(i * 1.7 + 1))) * pop(t, 8.25 + i * 0.04, 0.35);
    b.setAttribute('height', Math.max(0, h)); b.setAttribute('y', 620 - h / 2);
  });
  [conL, conR].forEach((cn, i) => { cn.style.strokeDashoffset = String(-t * 60); cn.style.opacity = fade(t, 8.9 + i * 0.9, 9.2 + i * 0.9); });
  draw(chip, prog(t, 8.3, 8.95)); chip.setAttribute('fill-opacity', prog(t, 8.7, 9.0));
  draw(pins, prog(t, 8.7, 9.3));
  tr(asr, { s: pop(t, 9.05, 0.4) });
  tr(orbit, { r: t * 40, o: fade(t, 8.9, 9.3) });
  tl3.forEach((l, i) => draw(l, prog(t, 10.08 + i * 0.22, 10.5 + i * 0.22, 'out')));
  dots3.forEach((d, i) => {
    const ph = ((t * 0.9 + i / 3) % 1), on = t > 9.2;
    const x = ph < 0.5 ? lerp(345, 425, ph * 2) : lerp(655, 745, (ph - 0.5) * 2);
    d.setAttribute('cx', x); d.style.opacity = on ? (t > 10.0 || ph < 0.5 ? 1 : 0) : 0;
  });

  // S4
  bub4.forEach((b, i) => {
    const t0 = B4[i][4];
    tr(b.g, { s: pop(t, t0, 0.5), o: (t < 16.3 || i === 3) ? 1 : 1 - 0.55 * prog(t, 16.3, 16.7) });
    const lit = i === 3 ? prog(t, 16.22, 16.55, 'out') : 0;
    tr(b.fill, { s: 0.2 + 0.8 * lit, o: lit });
    b.out.setAttribute('fill-opacity', 1 - lit); b.out.setAttribute('stroke', lit > 0.5 ? ORD : INK);
    b.ph.setAttribute('fill', lit > 0.5 ? BG : INK); b.lb.setAttribute('fill', lit > 0.5 ? BG : GRAY);
  });
  const rp = prog(t, 16.25, 17.0, 'out');
  ripple4.setAttribute('d', `M ${320 - 200 - 60 * rp} ${790 - 105 - 40 * rp} h ${400 + 120 * rp} v ${210 + 80 * rp} h ${-400 - 120 * rp} Z`);
  ripple4.style.opacity = t > 16.25 ? 1 - rp : 0; ripple4.setAttribute('rx', 30);
  tr(check4, { s: pop(t, 16.5, 0.4) }); draw(checkm, prog(t, 16.6, 16.9));

  // S5
  grid5.forEach((g, i) => draw(g, prog(t, 17.45 + i * 0.08, 17.9 + i * 0.08)));
  draw(axis5, prog(t, 17.4, 18.0));
  bar5.forEach((b, i) => {
    tr(b.prev, { sy: prog(t, 18.0 + i * 0.12, 18.55 + i * 0.12, 'back'), origin: 'bottom' });
    tr(b.fal, { sy: prog(t, 19.45 + i * 0.12, 20.0 + i * 0.12, 'back'), origin: 'bottom' });
    tr(b.n, { o: fade(t, 18.0 + i * 0.12, 18.3 + i * 0.12) });
  });
  tr(leg5b, { x: 20 * (1 - prog(t, 20.2, 20.6, 'out')), o: fade(t, 20.2, 20.5) });
  tr(leg5, { x: 20 * (1 - prog(t, 20.88, 21.3, 'out')), o: fade(t, 20.88, 21.2) });
  draw(down5, prog(t, 20.2, 20.7, 'out'));

  // S6
  draw(tline, prog(t, 22.5, 23.1));
  ticks6.forEach((k, i) => draw(k, prog(t, 22.6 + i * 0.03, 22.8 + i * 0.03)));
  const w = t < 25.14 ? W1 : W2, px = xOf(t, w);
  wave6.forEach((b, i) => {
    const x = 966 - i * 12.4, tt = mapr(x, 960, 120, w[0], w[1]);
    const h = x >= px ? 6 + 90 * amp(tt) : 4;
    b.setAttribute('height', h); b.setAttribute('y', 830 - h / 2); b.setAttribute('fill', x >= px ? INK : GRAY);

<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F0EEE6; }
  svg { display: block; }
  /* placeholder faces for the few words inside the graphics — the user picks the real fonts from specimens */
  @font-face { font-family: 'KadrHead'; src: local('Readex Pro Bold'), local('ReadexPro-Bold'), local('Readex Pro'); }
  @font-face { font-family: 'KadrBody'; src: local('Readex Pro Medium'), local('ReadexPro-Medium'), local('Readex Pro'); }
  @font-face { font-family: 'KadrMono'; src: local('Cascadia Mono'), local('CascadiaMono-Regular'), local('Consolas'); }
  .ar { font-family: 'KadrHead'; direction: rtl; }
  .ar2 { font-family: 'KadrBody'; direction: rtl; }
  .en { font-family: 'KadrBody'; }
  .mono { font-family: 'KadrMono'; }
</style>
<script src="../kadr-motion.js"></script>
<script src="data.js"></script>
</head><body>
<svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="54" height="54" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.4" fill="#C9C1B2" fill-opacity=".55"/></pattern>
    <filter id="mblur" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur id="mblurk" stdDeviation="0.01 0.01"/></filter>
    <clipPath id="wmClip"><rect id="wmClipR" x="0" y="0" width="1080" height="10"/></clipPath>
    <clipPath id="splitL"><rect id="splitLR" x="0" y="0" width="10" height="10"/></clipPath>
    <clipPath id="splitR"><rect id="splitRR" x="0" y="0" width="10" height="10"/></clipPath>
  </defs>
  <rect id="bgrect" width="1080" height="1920" fill="#F0EEE6"/>
  <g id="para"><rect x="-6000" y="-6000" width="12000" height="12000" fill="url(#dots)"/></g>
  <g id="camwrap" filter="url(#mblur)"><g id="cam"></g></g>
</svg>
<script>
/* KADR FOR FILMORA — official example. One continuous cream world, one orange dot (the user's voice / intent) that
   carries the whole film: voice → caret → send → pen → courier → playhead → spring → logo. Every element group is its
   own transparent layer (KADR.layers + KADR.solo); the background (cream + parallax dot grid) is separate. */
const { E, clamp, lerp, mapr, prog, pop, fade, draw, tr, spring, springs, expOut, zoomLerp, $ } = KADR_HELPERS;
const INK = '#141413', OR = '#D97757', BG = '#F0EEE6', GREY = '#B4AC9D';
const NS = 'http://www.w3.org/2000/svg';
const DUR = 30.2, FPS = 30;
const SIO = u => 0.5 - 0.5 * Math.cos(Math.PI * clamp(u, 0, 1));          // sine in-out (gentle peak speed for flights)
const lin = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const bump = (t, a, d) => Math.sin(Math.PI * lin(t, a, a + d));            // 0 → 1 → 0
const amp = t => AMP[clamp(Math.round(t * FPS), 0, AMP.length - 1)] || 0;
const W = WORDS.map(w => ({ w: w[0], s: w[1], e: w[2] }));
const wordAt = (txt, after = 0) => W.find(w => w.w.replace(/[،.؟]/g, '') === txt && w.s >= after);

// ---- world: scene origins (camera centre = origin + (540, 670)); dominant travel = leftward (RTL), then up for the end
const O = { A: [0, 0], B: [-1300, 120], C: [-2600, 0], D: [-2600, -1300] };
const wpt = (k, x, y) => [O[k][0] + x, O[k][1] + y];

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || $('cam')).appendChild(e);
  return e;
}
const line = (d, p, extra = {}) => el('path', Object.assign({ d, pathLength: 1, fill: 'none', stroke: INK, 'stroke-width': 7,
  'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, extra), p);
const text = (s, x, y, cls, size, fill, p, anchor = 'middle') => { const e = el('text', { x, y, class: cls, 'font-size': size, fill,
  'text-anchor': anchor, 'dominant-baseline': 'middle' }, p); e.textContent = s; return e; };
const scene = k => el('g', { transform: `translate(${O[k][0]} ${O[k][1]})` });
const setT = (e, s) => e.setAttribute('transform', s);

// ---- layers: every group made with lay() is one transparent clip in Filmora
const LAYERS = [{ name: 'bg', start: 0, end: DUR, opaque: true }];
const LG = [];
const lay = (lname, parent, a, b) => { const g = el('g', { 'data-layer': lname }, parent); LG.push({ name: lname, start: Math.max(0, a), end: Math.min(DUR, b), g }); return g; };

// ================================================================ scene A — S1 voice bubble → S2 composer
const gA = scene('A');
const L_bubble = lay('S1-2_bubble_to_composer', gA, 0, 8.4);
const bubble = line('', L_bubble, { fill: BG, 'fill-opacity': 0 });
const L_frame = lay('S1-2_kadr_frame', gA, 1.4, 8.4);
const brk = [0, 1, 2, 3].map(() => line('', L_frame, { 'stroke-width': 9 }));
const L_bars = lay('S1_voice_bars', gA, 0, 3.75);
const bars1 = [...Array(13)].map(() => el('rect', { x: 0, y: 0, width: 18, height: 18, rx: 9, fill: OR }, L_bars));
const L_typed = lay('S2_typed_request', gA, 3.6, 8.4);
const REQ = [['بدّي', 'ريل', 'من', 'هالفيديو،'], ['قص', 'السكتات', 'وحط', 'ترجمة']];
const typed = REQ.map((ln, li) => ln.map(w => text(w, 0, li ? 648 : 568, 'ar2', 50, INK, L_typed)));
const L_chip = lay('S2_model_chip', gA, 5.4, 8.4);
const chipR = el('rect', { x: 760, y: 707, width: 160, height: 54, rx: 27, fill: BG, stroke: INK, 'stroke-width': 5 }, L_chip);
const chipT = text('Claude', 840, 735, 'en', 30, INK, L_chip);
const L_send = lay('S2_send_button', gA, 3.8, 8.4);
const sendRing = el('circle', { cx: 178, cy: 734, r: 36, fill: 'none', stroke: GREY, 'stroke-width': 5 }, L_send);

// ================================================================ scene B — S3 file, S4 four parts, S5 editor, S6 timeline
const gB = scene('B');
const FILE0 = [370, 430, 710, 870], FILE1 = [418, 682, 662, 998], WIN = [90, 300, 990, 1060];
const L_file = lay('S3-5_file_to_window', gB, 7.6, 20.4);
const filePath = line('', L_file, { fill: BG, 'fill-opacity': 1 });
const fold = line('', L_file, { 'stroke-width': 6 });
const L_lines = lay('S3_written_lines', gB, 7.6, 14.7);
const LW = [210, 170, 245, 130, 200], LY = [560, 615, 670, 725, 780];
const wl = LW.map((w, i) => line(`M 655 ${LY[i]} H ${655 - w}`, L_lines, { 'stroke-width': i ? 12 : 17 }));
const L_tag = lay('S3_wfp_tag', gB, 9.2, 14.7);
el('rect', { x: 318, y: 810, width: 150, height: 60, rx: 30, fill: INK }, L_tag);
text('.wfp', 393, 841, 'mono', 32, BG, L_tag);

// S5 editor chrome (drawn after the file opens into the window)
const L_panels = lay('S5_editor_panels', gB, 14.3, 20.4);
const chrome = [
  line('M 90 352 H 990', L_panels, { 'stroke-width': 6 }),
  ...[130, 158, 186].map(x => line(`M ${x - 8} 326 a 8 8 0 1 0 16 0 a 8 8 0 1 0 -16 0`, L_panels, { 'stroke-width': 4 })),
  line('M 470 326 H 610', L_panels, { stroke: GREY, 'stroke-width': 8 }),
];
const preview = line('M 342 378 H 738 Q 750 378 750 390 V 602 Q 750 614 738 614 H 342 Q 330 614 330 602 V 390 Q 330 378 342 378 Z', L_panels, { 'stroke-width': 6 });
const binTh = [...Array(6)].map((_, i) => line(`M ${118 + (i % 2) * 92} ${388 + Math.floor(i / 2) * 76} h 78 v 60 h -78 Z`, L_panels, { stroke: GREY, 'stroke-width': 4 }));
const props = [...Array(4)].map((_, i) => line(`M 790 ${402 + i * 56} H 960`, L_panels, { stroke: GREY, 'stroke-width': 4 }));
const knobs = [0.3, 0.7, 0.45, 0.85].map((u, i) => el('circle', { cx: 790 + 170 * u, cy: 402 + i * 56, r: 9, fill: BG, stroke: INK, 'stroke-width': 4 }, L_panels));
const tlDiv = line('M 90 640 H 990', L_panels, { 'stroke-width': 6 });
const ruler = [...Array(20)].map((_, i) => line(`M ${210 + i * 39} 656 V ${i % 4 ? 664 : 672}`, L_panels, { stroke: GREY, 'stroke-width': 3 }));
const LANE = [715, 790, 865, 940];
const laneHead = LANE.map(y => line(`M 112 ${y - 24} H 178 M 112 ${y + 24} H 178`, L_panels, { stroke: GREY, 'stroke-width': 3 }));
const L_prev = lay('S5_preview_voice', gB, 14.8, 20.4);
const miniB = line('M 466 440 H 614 Q 630 440 630 456 V 524 Q 630 540 614 540 H 500 L 482 560 L 486 540 H 466 Q 450 540 450 524 V 456 Q 450 440 466 440 Z', L_prev, { 'stroke-width': 5 });
const miniBars = [...Array(7)].map(() => el('rect', { x: 0, y: 0, width: 9, height: 9, rx: 4.5, fill: OR }, L_prev));

// S6 clips (each its own layer) + playhead
const CLIP = [[205, 640], [300, 520], [420, 610], [205, 760]];
const clipL = ['S6_clip_video', 'S6_clip_title', 'S6_clip_effect', 'S6_clip_audio'].map(n => lay(n, gB, 15.6, 20.4));
const clips = CLIP.map(([x0, x1], k) => {
  const g = el('g', {}, clipL[k]);
  const r = el('rect', { x: x0, y: LANE[k] - 27, width: x1 - x0, height: 54, rx: 10, fill: BG, stroke: INK, 'stroke-width': 5 }, g);
  return { g, r, x0, x1, inner: el('g', {}, g) };
});
[...Array(6)].map((_, i) => line(`M ${267 + i * 62} 692 V 738`, clips[0].inner, { stroke: GREY, 'stroke-width': 3 }));
line('M 318 776 H 346 M 332 776 V 806', clips[1].inner, { 'stroke-width': 5 });
line('M 362 784 H 470 M 362 798 H 430', clips[1].inner, { stroke: GREY, 'stroke-width': 4 });
el('path', { d: sparkD(450, 865, 15), fill: INK }, clips[2].inner);
line('M 480 865 H 585', clips[2].inner, { stroke: GREY, 'stroke-width': 4, 'stroke-dasharray': '2 10' });
const AUD = [...Array(78)].map((_, i) => { const x = 216 + i * 9;
  let a = 0; for (let k = 0; k < 11; k++) a = Math.max(a, AMP[Math.min(AMP.length - 1, Math.round((i * 11 + k) * 0.98))] || 0);
  return el('rect', { x: x - 1.75, y: 940 - (4 + 34 * a) / 2, width: 3.5, height: 4 + 34 * a, rx: 1.75, fill: INK }, clips[3].inner); });
const trimH = el('rect', { x: 0, y: 913, width: 12, height: 54, rx: 6, fill: OR }, clipL[3]);
const L_play = lay('S6_playhead', gB, 15.2, 20.4);
const playLine = line('M 0 652 V 980', L_play, { stroke: OR, 'stroke-width': 5 });

// S4 four parts — rounded tiles on an arc (created after the window so they fly over it into their lanes)
const L_con = lay('S4_connectors', gB, 10.4, 14.7);
const TILE = [[870, 455], [650, 385], [430, 385], [210, 455]];
const cons = TILE.map(([x, y]) => line(`M 540 684 Q ${x} ${y + 230} ${x} ${y + 66}`, L_con, { stroke: GREY, 'stroke-width': 5 }));
const tileNames = ['S4_part_clips', 'S4_part_texts', 'S4_part_effects', 'S4_part_sounds'];
const parts = TILE.map(([x, y], k) => {
  const g = lay(tileNames[k], gB, 10.4, 16.5);
  const box = el('rect', { x: x - 65, y: y - 65, width: 130, height: 130, rx: 30, fill: BG, stroke: INK, 'stroke-width': 7 }, g);
  const gl = glyph(k, g, x, y, 1);
  return { g, box, gl, x, y };
});
function sparkD(cx, cy, s) {
  return `M ${cx} ${cy - s} C ${cx + s * .12} ${cy - s * .25} ${cx + s * .25} ${cy - s * .12} ${cx + s} ${cy} C ${cx + s * .25} ${cy + s * .12} ${cx + s * .12} ${cy + s * .25} ${cx} ${cy + s} C ${cx - s * .12} ${cy + s * .25} ${cx - s * .25} ${cy + s * .12} ${cx - s} ${cy} C ${cx - s * .25} ${cy - s * .12} ${cx - s * .12} ${cy - s * .25} ${cx} ${cy - s} Z`;
}
function glyph(k, p, x, y, s) {               // returns {acc:[elements that take the accent], all:[...]}
  const g = el('g', {}, p), acc = [];
  if (k === 0) {        // clip: film frame + play
    line(`M ${x - 40} ${y - 28} H ${x + 40} V ${y + 28} H ${x - 40} Z M ${x - 40} ${y - 14} H ${x - 28} M ${x - 40} ${y + 14} H ${x - 28} M ${x + 28} ${y - 14} H ${x + 40} M ${x + 28} ${y + 14} H ${x + 40}`, g, { 'stroke-width': 6 });
    acc.push(el('path', { d: `M ${x - 9} ${y - 14} L ${x + 15} ${y} L ${x - 9} ${y + 14} Z`, fill: INK, 'stroke-linejoin': 'round' }, g));
  } else if (k === 1) { // text: T with a caret line
    acc.push(line(`M ${x - 30} ${y - 26} H ${x + 22} M ${x - 4} ${y - 26} V ${y + 30}`, g, { 'stroke-width': 9 }));
    line(`M ${x + 30} ${y - 6} V ${y + 30}`, g, { 'stroke-width': 5 });
  } else if (k === 2) { // effects: sparkle
    acc.push(el('path', { d: sparkD(x - 6, y + 6, 34), fill: INK }, g));
    acc.push(el('path', { d: sparkD(x + 26, y - 26, 12), fill: INK }, g));
  } else {              // sounds: live bars
    [-30, -15, 0, 15, 30].forEach(dx => acc.push(el('rect', { x: x + dx - 4.5, y: y - 10, width: 9, height: 20, rx: 4.5, fill: INK }, g)));
  }
  return { g, acc };
}

// ================================================================ scene C — S7 four features, S8 "anything"
const gC = scene('C');
const T7 = [[558, 322], [102, 322], [558, 688], [102, 688]];   // tile top-left corners: TR, TL, BR, BL
const TW = 420, TH = 330;
const tnames = ['S7_tile_beat_cut', 'S7_tile_captions', 'S7_tile_motion', 'S7_tile_split'];
const TSTART = [20.1, 21.4, 22.66, 23.58];
const tiles = T7.map(([x, y], k) => {
  const g = lay(tnames[k], gC, TSTART[k] - 0.3, 26.1);
  const frame = line(`M ${x + 30} ${y} H ${x + TW - 30} Q ${x + TW} ${y} ${x + TW} ${y + 30} V ${y + TH - 30} Q ${x + TW} ${y + TH} ${x + TW - 30} ${y + TH} H ${x + 30} Q ${x} ${y + TH} ${x} ${y + TH - 30} V ${y + 30} Q ${x} ${y} ${x + 30} ${y} Z`, g, { fill: BG, 'fill-opacity': 0 });
  return { g, frame, cx: x + TW / 2, cy: y + TH / 2 };
});
// tile 1 — beat cut: music waveform with beats, a clip strip that gets cut on every beat as the playhead passes
const BEATX = [650, 735, 820, 900];
const wv1 = [...Array(30)].map((_, i) => { const x = 600 + i * 11.6;
  const b = Math.max(...BEATX.map(bx => Math.exp(-Math.pow((x - bx) / 9, 2))));
  const h = 12 + 22 * (0.5 + 0.5 * Math.sin(i * 2.3)) * 0.6 + 70 * b;
  return { e: el('rect', { x: x - 2.75, y: 0, width: 5.5, height: h, rx: 2.75, fill: b > 0.5 ? INK : GREY }, tiles[0].g), h, x }; });
const strip = [...Array(5)].map(() => el('rect', { x: 0, y: 512, width: 10, height: 64, rx: 10, fill: BG, stroke: INK, 'stroke-width': 5 }, tiles[0].g));
const cutMk = BEATX.map(bx => line(`M ${bx} 498 V 590`, tiles[0].g, { stroke: OR, 'stroke-width': 5 }));
const play1 = line('M 0 395 V 600', tiles[0].g, { stroke: OR, 'stroke-width': 4 });
// tile 2 — word-by-word captions on the real voice
const voiceLine = el('path', { d: '', fill: 'none', stroke: INK, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, tiles[1].g);
const CW = [wordAt('ترجمة'), wordAt('كلمة', 21), wordAt('بكلمة')];
const chips2 = CW.map((w, i) => { const g = el('g', {}, tiles[1].g);
  const r = el('rect', { x: 0, y: 532, width: 10, height: 66, rx: 33, fill: BG, stroke: INK, 'stroke-width': 5 }, g);
  const tx = text(w.w.replace(/[،.]/g, ''), 0, 566, 'ar', 30, INK, g); return { g, r, tx, s: w.s, e: w.e }; });
// tile 3 — motion: a spring curve drawn by the dot
const axes3 = line('M 600 722 V 978 H 944', tiles[2].g, { stroke: GREY, 'stroke-width': 4 });
const goal3 = line('M 606 795 H 944', tiles[2].g, { stroke: GREY, 'stroke-width': 3, 'stroke-dasharray': '3 11' });
const trail3 = el('path', { d: '', fill: 'none', stroke: INK, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, tiles[2].g);
const SPX0 = 608, SPX1 = 936, SPY0 = 972, SPY1 = 795, SP_T0 = 22.72, SP_T1 = 23.5;
const springY = u => lerp(SPY0, SPY1, spring(u * 1.6, 0, 1.25, 0.32));
// tile 4 — split screen: one landscape frame, the dot draws the divider, a portrait slides into the right half
const fr4 = line('M 156 728 H 468 Q 482 728 482 742 V 964 Q 482 978 468 978 H 156 Q 142 978 142 964 V 742 Q 142 728 156 728 Z', tiles[3].g, { 'stroke-width': 6 });
const leftC = el('g', { 'clip-path': 'url(#splitL)' }, tiles[3].g), rightC = el('g', { 'clip-path': 'url(#splitR)' }, tiles[3].g);
const mount = line('M 150 960 L 230 860 L 282 918 L 340 840 L 440 960', leftC, { 'stroke-width': 6 });
const sun4 = line('M 392 790 a 22 22 0 1 0 44 0 a 22 22 0 1 0 -44 0', leftC, { 'stroke-width': 6 });
const person = el('g', {}, rightC);
line('M 397 830 a 30 30 0 1 0 0.1 0', person, { 'stroke-width': 6 });
line('M 340 978 Q 342 892 397 888 Q 452 892 454 978', person, { 'stroke-width': 6 });
const div4 = line('M 312 728 V 978', tiles[3].g, { 'stroke-width': 6 });
// S8 — twelve more tiles around the four: "anything you want"
const L_more = lay('S8_more_tiles', gC, 24.6, 26.1);
const CX = [204, 428, 652, 876], CY = [391, 577, 763, 949];
const more = [];
CY.forEach((cy, r) => CX.forEach((cx, c) => { if ((r === 1 || r === 2) && (c === 1 || c === 2)) return;
  const g = el('g', {}, L_more);
  line(`M ${cx - 87} ${cy - 86} H ${cx + 87} Q ${cx + 105} ${cy - 86} ${cx + 105} ${cy - 68} V ${cy + 68} Q ${cx + 105} ${cy + 86} ${cx + 87} ${cy + 86} H ${cx - 87} Q ${cx - 105} ${cy + 86} ${cx - 105} ${cy + 68} V ${cy - 68} Q ${cx - 105} ${cy - 86} ${cx - 87} ${cy - 86} Z`, g, { fill: BG, 'stroke-width': 5 });
  miniGlyph(more.length, g, cx, cy);
  more.push({ g, cx, cy, d: Math.hypot(cx - 540, (cy - 670) * 1.1) }); }));
const rank = more.map(m => m.d).sort((a, b) => a - b);
more.forEach(m => m.rank = rank.indexOf(m.d) + 0.01 * more.indexOf(m));
function miniGlyph(i, g, x, y) {
  const P = { 'stroke-width': 5 }, s = [
    `M ${x - 26} ${y - 18} H ${x + 26} V ${y + 18} H ${x - 26} Z M ${x - 6} ${y - 8} L ${x + 8} ${y} L ${x - 6} ${y + 8} Z`,              // clip
    `M ${x - 12} ${y + 22} a 9 9 0 1 0 0.1 0 M ${x + 14} ${y + 14} a 9 9 0 1 0 0.1 0 M ${x - 3} ${y + 20} V ${y - 24} L ${x + 23} ${y - 30} V ${y + 12}`, // music
    `M ${x - 28} ${y - 20} H ${x + 28} V ${y + 12} H ${x - 4} L ${x - 16} ${y + 24} V ${y + 12} H ${x - 28} Z`,                        // chat
    `M ${x - 26} ${y - 8} V ${y - 24} H ${x - 10} M ${x + 10} ${y - 24} H ${x + 26} V ${y - 8} M ${x + 26} ${y + 8} V ${y + 24} H ${x + 10} M ${x - 10} ${y + 24} H ${x - 26} V ${y + 8}`, // crop
    `M ${x - 28} ${y + 14} A 28 28 0 0 1 ${x + 28} ${y + 14} M ${x} ${y + 14} L ${x + 14} ${y - 6}`,                                   // speed
    `M ${x - 28} ${y - 14} H ${x + 10} V ${y + 18} H ${x - 28} Z M ${x + 10} ${y - 2} L ${x + 28} ${y - 12} V ${y + 16} L ${x + 10} ${y + 6}`, // camera
    `M ${x} ${y - 26} L ${x + 28} ${y - 12} L ${x} ${y + 2} L ${x - 28} ${y - 12} Z M ${x - 28} ${y + 2} L ${x} ${y + 16} L ${x + 28} ${y + 2}`, // layers
    `M ${x - 10} ${y - 10} a 10 10 0 1 0 0.1 0 M ${x + 10} ${y + 10} a 10 10 0 1 0 0.1 0 M ${x - 2} ${y - 4} L ${x + 26} ${y - 24} M ${x + 2} ${y + 4} L ${x + 26} ${y + 24}`, // scissors
    `M ${x - 30} ${y + 20} L ${x - 8} ${y - 8} L ${x + 6} ${y + 8} L ${x + 14} ${y} L ${x + 30} ${y + 20} Z M ${x + 14} ${y - 22} a 7 7 0 1 0 0.1 0`, // image
    `M ${x - 6} ${y - 22} a 6 14 0 0 1 12 0 V ${y} a 6 14 0 0 1 -12 0 Z M ${x - 18} ${y - 2} a 18 18 0 0 0 36 0 M ${x} ${y + 16} V ${y + 26}`,   // mic
    `M ${x - 24} ${y - 14} H ${x + 24} M ${x - 24} ${y} H ${x + 14} M ${x - 24} ${y + 14} H ${x + 4}`,                                   // text lines
    `M ${x - 26} ${y} a 26 26 0 1 0 52 0 a 26 26 0 1 0 -52 0 M ${x} ${y - 14} V ${y} L ${x + 10} ${y + 8}`,                              // clock
  ][i % 12];
  line(s, g, P);
}

// ================================================================ scene D — S9 logo: the frame (كادر) + the dot
const gD = scene('D');
const L_lframe = lay('S9_logo_frame', gD, 25.7, DUR);
const lbrk = [0, 1, 2, 3].map(() => line('', L_lframe, { 'stroke-width': 10 }));
const L_word = lay('S9_wordmark', gD, 26.2, DUR);
const wmG = el('g', { 'clip-path': 'url(#wmClip)' }, L_word);
const WM_Y = 700;
const wordmark = el('text', { x: 556, y: WM_Y, class: 'ar', 'font-size': 230, fill: INK, 'text-anchor': 'middle' }, wmG);
wordmark.textContent = 'كادر';
const L_inst = lay('S9_install_chip', gD, 27.3, DUR);
const instG = el('g', {}, L_inst);
